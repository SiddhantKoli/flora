name: flora
description: An offline-first plant discovery game.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  camera: ^0.12.2
  image: ^4.5.4
  path: ^1.9.0
  path_provider: ^2.1.4
  sqflite: ^2.4.1
  uuid: ^4.5.1
  flutter_animate: 4.5.2
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/flora_leaf_editorial.png
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
